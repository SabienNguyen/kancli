version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - os.Remove
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
